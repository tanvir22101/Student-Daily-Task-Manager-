
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Task Manager</h1>

    <p>Manage your daily study tasks easily.</p>
    
<div class="dashboard">

    <div class="stat-card">
        <h3>Total Tasks</h3>
        <p id="totalTasks">0</p>
    </div>

    <div class="stat-card">
        <h3>Completed</h3>
        <p id="completedTasks">0</p>
    </div>

    <div class="stat-card">
        <h3>Pending</h3>
        <p id="pendingTasks">0</p>
    </div>

</div>


    <input type="text" id="taskInput" placeholder="Enter a task">

    <button id="addTaskBtn" type="button">Add Task</button>

    <h2>My Tasks</h2>

    <ul id="taskList"></ul>

    <script src="script.js"></script>

</body>

</html>
